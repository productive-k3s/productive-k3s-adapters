services:
  web:
    image: ghcr.io/example/openship-demo:1.0.0
    environment:
      APP_ENV: production
      DATABASE_HOST: db
      REDIS_HOST: cache
    ports:
      - "8080:8080"
    depends_on:
      - db
      - cache

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: change-me
    volumes:
      - pgdata:/var/lib/postgresql/data

  cache:
    image: redis:7

volumes:
  pgdata: {}
